name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install skills-ref PyYAML
      - name: Validate release
        run: |
          python -m unittest discover -s evals -p 'test_*.py' -v
          for d in skills/*/; do agentskills validate "$d"; done
      - name: Build one .skill file per skill
        run: python scripts/package_skills.py --output "$RUNNER_TEMP/learning-skills" --tag "$GITHUB_REF_NAME"
      - name: Select release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="evals/release-${version#*-}.md"
          echo "title=${version/-experimental./ experimental }" >> "$GITHUB_OUTPUT"
          if test -f "$notes"; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/learning-skills/*.skill
          name: ${{ steps.notes.outputs.title }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
