name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build one .skill file per skill
        run: |
          mkdir -p dist
          cd skills
          for d in */; do n="${d%/}"; zip -qr "../dist/$n.skill" "$n"; done
          ls -l ../dist
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.skill
          generate_release_notes: true
